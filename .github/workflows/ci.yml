name: CI

# 同一分支的新 PR push 会取消尚未完成的旧 run, 避免 CI 积压
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 仅在 PR 合并前触发 (避免合并进 main 后重复跑一次), 并支持手动触发兜底
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'pull_request' }}
          shared-key: aidb-lint
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Check format
        run: cargo fmt --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features

      - name: Check core engine (no default features)
        run: cargo check --no-default-features

  test:
    name: Nextest All Features
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'pull_request' }}
          shared-key: aidb-test
      - name: Install protoc & cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: protoc, cargo-nextest

      - name: Run tests (nextest)
        env:
          PROPTEST_CASES: 25
        run: cargo nextest run --profile ci --lib --tests --all-features
